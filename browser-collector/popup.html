<!doctype html>
<html lang="zh-CN">

<title>语雀单篇导出</title>
<style>
body{font:14px/1.6 system-ui,sans-serif;width:340px;margin:20px;color:#24292f}h1{font-size:18px}button{border:0;border-radius:6px;padding:10px 18px;background:#167b58;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 system-ui;background:#f5f6f7;padding:12px;border-radius:6px}

<h1>采集当前语雀文章</h1>
<p>先在当前标签页登录并打开自己的文章。可直接下载 Markdown ZIP，内含正文和本地图片附件；也可保存原始 JSON 采集包。</p>
<p>通常仅采集无未发布修改的文章；已逐篇核对阅读态的正文须匹配本地版本记录。版本不符、特殊文档或资源失败时停止。采集期间请保持窗口打开。</p>
<button id="capture-markdown">导出 Markdown（ZIP）</button>
<p><button id="capture">导出原始 JSON</button></p>
<p>Markdown ZIP 自动保存到下载目录的 yuque-migration 文件夹。其他文章链接保留语雀地址，公式需使用支持 LaTeX 的阅读器。完成下载前请保持此窗口打开。</p>
<pre id="status" aria-live="polite">尚未开始。</pre>
<p><a href="batch.html" target="_blank" rel="noopener">打开目录盘点与批量采集</a></p>
