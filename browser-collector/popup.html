<h1>采集当前语雀文章</h1>
<p>先在当前标签页登录并打开自己的文章。采集正文和图片附件，保存到本机 JSON 文件。</p>
<p>通常仅采集无未发布修改的文章；已逐篇核对阅读态的正文须匹配本地版本记录。版本不符、特殊文档或资源失败时停止。采集期间请保持窗口打开。</p>
<button id="capture">采集当前文章</button>
<pre id="status" aria-live="polite">尚未开始。</pre>
